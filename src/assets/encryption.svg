<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Círculo exterior -->
    <circle cx="60" cy="60" r="55" stroke="#4CAF50" stroke-width="4" fill="none"/>
    
    <!-- Círculos concéntricos -->
    <circle cx="60" cy="60" r="45" stroke="#4CAF50" stroke-width="2" fill="none"/>
    <circle cx="60" cy="60" r="35" stroke="#4CAF50" stroke-width="2" fill="none"/>
    
    <!-- Líneas de conexión -->
    <line x1="60" y1="15" x2="60" y2="105" stroke="#4CAF50" stroke-width="2"/>
    <line x1="15" y1="60" x2="105" y2="60" stroke="#4CAF50" stroke-width="2"/>
    
    <!-- Puntos de conexión -->
    <circle cx="60" cy="60" r="5" fill="#4CAF50"/>
    <circle cx="60" cy="30" r="3" fill="#4CAF50"/>
    <circle cx="60" cy="90" r="3" fill="#4CAF50"/>
